name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release gate
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not in origin/main history."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: go.mod

      - name: Check source before release
        run: make fmt-check vet test

      - name: Package release
        env:
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package \
            VERSION="${GITHUB_REF_NAME#v}" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$COMMIT"
          sha256sum dist/*.tar.gz
          (cd dist && sha256sum -c -- *.tar.gz.sha256)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
